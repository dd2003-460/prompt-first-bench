[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ralph-runtime"
version = "0.1.0"
description = "Minimal RALPH prompt-action state machine runtime"
requires-python = ">=3.10"
dependencies = ["python-statemachine>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ralph = "ralph_runtime.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
